{{template "base" .}}
{{define "content"}}
<div class="page-header d-flex align-items-center justify-content-between">
    <div>
        <h1 class="page-title"><i class="bi bi-paypal me-2 text-primary"></i>PayPal Accounts</h1>
        <p class="text-muted mb-0 mt-1">Quản lý tài khoản PayPal</p>
    </div>
    <span class="badge bg-label-primary" id="paypal-count">0 accounts</span>
</div>

<!-- Add PayPal Form -->
<div class="card mb-4">
    <div class="card-header d-flex align-items-center gap-2" style="cursor:pointer" data-bs-toggle="collapse"
        data-bs-target="#form-paypal-collapse">
        <i class="bi bi-plus-circle text-primary"></i>
        <span class="card-title">Thêm PayPal Account</span>
        <i class="bi bi-chevron-down ms-auto"></i>
    </div>
    <div class="collapse show" id="form-paypal-collapse">
        <div class="card-body">
            <form id="form-paypal">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">PayPal Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-paypal"></i></span>
                            <input type="email" class="form-control" id="paypal-email" placeholder="account@paypal.com"
                                required>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="paypal-owner" placeholder="(optional)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Balance</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0" class="form-control" id="paypal-balance"
                                placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Currency</label>
                        <select class="form-select" id="paypal-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="paypal-status">
                            <option value="active">Active</option>
                            <option value="limited">Limited</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" class="form-check-input" id="paypal-verified">
                            <label class="form-check-label" for="paypal-verified">Verified</label>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label class="form-label">Note</label>
                        <input type="text" class="form-control" id="paypal-note" placeholder="(optional)">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add PayPal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- PayPal Table -->
<div class="card">
    <div class="card-header">
        <span class="card-title">PayPal Accounts</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th class="sortable" data-k="email">Email</th>
                        <th>Owner</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Verified</th>
                        <th>Note</th>
                        <th>Linked Email</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody-paypals">
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit PayPal Modal -->
<div class="modal fade" id="editPayPalModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit PayPal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-paypal-id">
                <div class="mb-3">
                    <label class="form-label fw-semibold">PayPal Email</label>
                    <input type="email" id="edit-paypal-email" class="form-control">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Owner Name</label>
                        <input type="text" id="edit-paypal-owner" class="form-control" placeholder="(optional)">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Status</label>
                        <select id="edit-paypal-status" class="form-select">
                            <option value="active">Active</option>
                            <option value="limited">Limited</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Balance</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0" id="edit-paypal-balance" class="form-control"
                                placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Currency</label>
                        <select id="edit-paypal-currency" class="form-select">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Linked Email Account</label>
                    <select id="edit-paypal-linked-email" class="form-select">
                        <option value="">— None —</option>
                    </select>
                    <div class="form-text">Gắn PayPal này với một email account</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Note</label>
                    <input type="text" id="edit-paypal-note" class="form-control" placeholder="Note">
                </div>
                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" id="edit-paypal-verified">
                    <label class="form-check-label" for="edit-paypal-verified">Verified</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.paypalMgr.savePayPal()">
                    <i class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
