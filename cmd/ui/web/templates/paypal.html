{{template "base" .}}
{{define "content"}}
<div class="page-header d-flex align-items-center justify-content-between">
    <div>
        <h1 class="page-title"><i class="bi bi-paypal me-2 text-primary"></i>PayPal Accounts</h1>
        <p class="text-muted mb-0 mt-1">Quản lý tài khoản PayPal</p>
    </div>
    <span class="badge bg-label-primary" id="paypal-count">0 accounts</span>
</div>

<!-- Add PayPal Form -->
<div class="card mb-4">
    <div class="card-header d-flex align-items-center gap-2" style="cursor:pointer" data-bs-toggle="collapse"
        data-bs-target="#form-paypal-collapse">
        <i class="bi bi-plus-circle text-primary"></i>
        <span class="card-title">Thêm PayPal Account</span>
        <i class="bi bi-chevron-down ms-auto"></i>
    </div>
    <div class="collapse show" id="form-paypal-collapse">
        <div class="card-body">
            <form id="form-paypal">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">PayPal Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-paypal"></i></span>
                            <input type="email" class="form-control" id="paypal-email" placeholder="account@paypal.com"
                                required>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="paypal-owner" placeholder="(optional)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Balance</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0" class="form-control" id="paypal-balance"
                                placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Currency</label>
                        <select class="form-select" id="paypal-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="paypal-status">
                            <option value="active">Active</option>
                            <option value="limited">Limited</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" class="form-check-input" id="paypal-verified">
                            <label class="form-check-label" for="paypal-verified">Verified</label>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label class="form-label">Note</label>
                        <input type="text" class="form-control" id="paypal-note" placeholder="(optional)">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add PayPal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- PayPal Table -->
<div class="card">
    <div class="card-header">
        <span class="card-title">PayPal Accounts</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th class="sortable" data-k="email">Email</th>
                        <th>Owner</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Verified</th>
                        <th>Note</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody-paypals">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
