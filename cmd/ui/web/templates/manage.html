{{template "base" .}}

{{define "title"}}Mappings{{end}}

{{define "content"}}
<div class="page-header mb-4">
    <div class="d-flex align-items-center justify-content-between">
        <div>
            <h5 class="page-title">Client Mappings</h5>
            <p class="text-muted small mb-0">Gán Client IP → Proxy Server → Node VPS</p>
        </div>
        <span class="badge bg-label-primary fs-6" id="mapping-count">— mappings</span>
    </div>
</div>

<!-- Create mapping form -->
<div class="card mb-4">
    <div class="card-header">
        <h6 class="card-title mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Tạo Mapping mới</h6>
    </div>
    <div class="card-body">
        <form id="form-mapping">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-lg-3">
                    <label class="form-label small fw-medium">Client IP Address</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-pc-display text-muted"></i></span>
                        <input type="text" name="client_ip" class="form-control" placeholder="192.168.1.100" required
                            pattern="^((25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(25[0-5]|2[0-4]\d|[01]?\d\d?)$">
                    </div>
                    <div class="form-text">Chỉ IPv4 /32</div>
                </div>
                <div class="col-12 col-lg-3">
                    <label class="form-label small fw-medium">Proxy Server</label>
                    <select name="proxy_id" id="select-proxy" class="form-select form-select-sm" required>
                        <option value="">-- Chọn proxy server --</option>
                    </select>
                </div>
                <div class="col-12 col-lg-3">
                    <label class="form-label small fw-medium">Node VPS <span class="text-muted">(tùy
                            chọn)</span></label>
                    <select name="node_id" id="select-node" class="form-select form-select-sm">
                        <option value="">-- Không gán node --</option>
                    </select>
                    <div class="form-text">Node VPS sẽ nhận proxy này khi sync</div>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-link-45deg me-1"></i>Create Mapping
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Mappings table -->
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 mappings-table">
            <thead>
                <tr>
                    <th data-k="id" class="sortable">ID</th>
                    <th data-k="client" class="sortable">Client IP/CIDR</th>
                    <th data-k="proxy" class="sortable">Proxy Server</th>
                    <th data-k="node" class="sortable">Node</th>
                    <th data-k="state" class="sortable">State</th>
                    <th data-k="port" class="sortable">Local Port</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbody-mappings">
                <tr>
                    <td colspan="7" class="text-center py-4 text-muted">
                        <div class="spinner-border spinner-border-sm me-2"></div>Loading...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{{end}}
