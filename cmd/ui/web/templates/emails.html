{{template "base" .}}
{{define "content"}}
<div class="page-header d-flex align-items-center justify-content-between">
    <div>
        <h1 class="page-title"><i class="bi bi-envelope me-2 text-primary"></i>Email Accounts</h1>
        <p class="text-muted mb-0 mt-1">Quản lý danh sách email accounts</p>
    </div>
    <span class="badge bg-label-primary" id="email-count">0 emails</span>
</div>

<!-- Add Email Form -->
<div class="card mb-4">
    <div class="card-header d-flex align-items-center gap-2" style="cursor:pointer" data-bs-toggle="collapse"
        data-bs-target="#form-email-collapse">
        <i class="bi bi-plus-circle text-primary"></i>
        <span class="card-title">Thêm Email mới</span>
        <i class="bi bi-chevron-down ms-auto"></i>
    </div>
    <div class="collapse show" id="form-email-collapse">
        <div class="card-body">
            <form id="form-email">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email-address" placeholder="user@gmail.com"
                                required>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Provider</label>
                        <select class="form-select" id="email-provider">
                            <option value="gmail">Gmail</option>
                            <option value="outlook">Outlook</option>
                            <option value="yahoo">Yahoo</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Password</label>
                        <input type="text" class="form-control" id="email-password" placeholder="(optional)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Recovery Email</label>
                        <input type="email" class="form-control" id="email-recovery" placeholder="(optional)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Note</label>
                        <input type="text" class="form-control" id="email-note" placeholder="(optional)">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add Email
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Email Table -->
<div class="card">
    <div class="card-header">
        <span class="card-title">Email Accounts</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead id="thead-emails">
                    <tr>
                        <th class="sortable" data-k="address">Address</th>
                        <th>Provider</th>
                        <th>Status</th>
                        <th>Linked PayPal</th>
                        <th>Note</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody-emails">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Email Modal -->
<div class="modal fade" id="editEmailModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit Email</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-email-id">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Address</label>
                    <input type="email" id="edit-email-address" class="form-control" placeholder="user@example.com">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Provider</label>
                        <select id="edit-email-provider" class="form-select">
                            <option value="gmail">Gmail</option>
                            <option value="outlook">Outlook</option>
                            <option value="yahoo">Yahoo</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Status</label>
                        <select id="edit-email-status" class="form-select">
                            <option value="active">Active</option>
                            <option value="disabled">Disabled</option>
                            <option value="banned">Banned</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="edit-email-password" class="form-control" placeholder="Password"
                        autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Recovery Email</label>
                    <input type="email" id="edit-email-recovery" class="form-control"
                        placeholder="recovery@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Note</label>
                    <input type="text" id="edit-email-note" class="form-control" placeholder="Note">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="window.emailMgr.saveEmail()">
                    <i class="bi bi-check2 me-1"></i>Save
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
