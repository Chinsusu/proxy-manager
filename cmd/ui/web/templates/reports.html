{{template "base" .}}
{{define "scripts"}}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{{end}}
{{define "content"}}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-bar-chart-line me-2 text-primary"></i>Reports & Analytics</h1>
    <p class="text-muted mb-0 mt-1">Tổng hợp thu nhập và thống kê</p>
</div>

<!-- Summary Cards -->
<div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-success-light"><i class="bi bi-cash-coin text-success"></i></div>
            <div>
                <div class="stat-value" id="rpt-total">$0.00</div>
                <div class="stat-label">Total Income</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-primary-light"><i class="bi bi-receipt text-primary"></i></div>
            <div>
                <div class="stat-value" id="rpt-count">0</div>
                <div class="stat-label">Transactions</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-warning-light"><i class="bi bi-paypal text-warning"></i></div>
            <div>
                <div class="stat-value" id="rpt-paypals">0</div>
                <div class="stat-label">PayPal Accounts</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-info-light"><i class="bi bi-envelope text-info"></i></div>
            <div>
                <div class="stat-value" id="rpt-emails">0</div>
                <div class="stat-label">Emails Managed</div>
            </div>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="row g-4 mb-4">
    <div class="col-xl-8">
        <div class="card h-100">
            <div class="card-header"><span class="card-title">Thu nhập theo tháng</span></div>
            <div class="card-body">
                <canvas id="chart-monthly" height="260"></canvas>
            </div>
        </div>
    </div>
    <div class="col-xl-4">
        <div class="card h-100">
            <div class="card-header"><span class="card-title">Theo nguồn</span></div>
            <div class="card-body d-flex align-items-center justify-content-center">
                <canvas id="chart-source" height="260"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- By Month breakdown -->
<div class="card">
    <div class="card-header"><span class="card-title">Chi tiết theo tháng</span></div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Income (USD)</th>
                        <th>% of Total</th>
                    </tr>
                </thead>
                <tbody id="tbody-report-months">
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let chartMonthly = null, chartSource = null;

    async function loadReport() {
        try {
            const [rptRes, ppRes, emRes] = await Promise.all([
                fetch('/api/v1/income/report'),
                fetch('/api/v1/paypals'),
                fetch('/api/v1/emails'),
            ]);
            const rpt = await rptRes.json();
            const pps = await ppRes.json();
            const ems = await emRes.json();

            document.getElementById('rpt-total').textContent = '$' + (rpt.total_usd || 0).toFixed(2);
            document.getElementById('rpt-count').textContent = rpt.count || 0;
            document.getElementById('rpt-paypals').textContent = Array.isArray(pps) ? pps.length : 0;
            document.getElementById('rpt-emails').textContent = Array.isArray(ems) ? ems.length : 0;

            // Monthly chart
            const months = Object.keys(rpt.by_month || {}).sort();
            const monthVals = months.map(m => rpt.by_month[m]);
            const palette = ['#7367F0', '#28C76F', '#FF9F43', '#00CFE8', '#EA5455', '#8A8D93'];

            if (chartMonthly) chartMonthly.destroy();
            chartMonthly = new Chart(document.getElementById('chart-monthly'), {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [{ label: 'Income (USD)', data: monthVals, backgroundColor: '#7367F0', borderRadius: 6 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { color: 'rgba(47,43,61,0.06)' } }, x: { grid: { display: false } } }
                }
            });

            // Source doughnut
            const sources = Object.keys(rpt.by_source || {});
            const sourceVals = sources.map(s => rpt.by_source[s]);
            if (chartSource) chartSource.destroy();
            chartSource = new Chart(document.getElementById('chart-source'), {
                type: 'doughnut',
                data: {
                    labels: sources,
                    datasets: [{ data: sourceVals, backgroundColor: palette, borderWidth: 2, borderColor: '#fff' }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // Monthly table
            const tbody = document.getElementById('tbody-report-months');
            if (months.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">No income data</td></tr>';
            } else {
                const total = rpt.total_usd || 0;
                tbody.innerHTML = months.slice().reverse().map(m => {
                    const v = rpt.by_month[m];
                    const pct = total > 0 ? ((v / total) * 100).toFixed(1) : 0;
                    return `<tr><td>${m}</td><td class="fw-semibold text-success">$${v.toFixed(2)}</td><td><div class="d-flex align-items-center gap-2"><div class="progress flex-grow-1" style="height:6px"><div class="progress-bar bg-primary" style="width:${pct}%"></div></div>${pct}%</div></td></tr>`;
                }).join('');
            }
        } catch (e) {
            console.error('report error', e);
        }
    }

    loadReport();
    setInterval(loadReport, 30000);
</script>
{{end}}
