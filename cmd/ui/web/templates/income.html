{{template "base" .}}
{{define "content"}}
<div class="page-header d-flex align-items-center justify-content-between">
    <div>
        <h1 class="page-title"><i class="bi bi-cash-stack me-2 text-success"></i>Income Tracking</h1>
        <p class="text-muted mb-0 mt-1">Ghi nhận và theo dõi thu nhập</p>
    </div>
</div>

<!-- Summary Cards -->
<div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-success-light">
                <i class="bi bi-cash-coin text-success"></i>
            </div>
            <div>
                <div class="stat-value" id="income-total">$0.00</div>
                <div class="stat-label">Total Income (USD)</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-primary-light">
                <i class="bi bi-calendar-month text-primary"></i>
            </div>
            <div>
                <div class="stat-value" id="income-month">$0.00</div>
                <div class="stat-label">This Month</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-info-light">
                <i class="bi bi-receipt text-info"></i>
            </div>
            <div>
                <div class="stat-value" id="income-count">0</div>
                <div class="stat-label">Transactions</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-warning-light">
                <i class="bi bi-paypal text-warning"></i>
            </div>
            <div>
                <div class="stat-value" id="income-paypal-total">$0.00</div>
                <div class="stat-label">via PayPal</div>
            </div>
        </div>
    </div>
</div>

<!-- Add Income Form -->
<div class="card mb-4">
    <div class="card-header d-flex align-items-center gap-2" style="cursor:pointer" data-bs-toggle="collapse"
        data-bs-target="#form-income-collapse">
        <i class="bi bi-plus-circle text-primary"></i>
        <span class="card-title">Ghi nhận thu nhập</span>
        <i class="bi bi-chevron-down ms-auto"></i>
    </div>
    <div class="collapse show" id="form-income-collapse">
        <div class="card-body">
            <form id="form-income">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Amount <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="income-amount" required
                                placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Currency</label>
                        <select class="form-select" id="income-currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Source</label>
                        <select class="form-select" id="income-source">
                            <option value="paypal">PayPal</option>
                            <option value="bank">Bank Transfer</option>
                            <option value="crypto">Crypto</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">PayPal Account</label>
                        <select class="form-select" id="income-paypal-id">
                            <option value="">(none)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Received At</label>
                        <input type="datetime-local" class="form-control" id="income-received-at">
                    </div>
                </div>
                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" id="income-description" placeholder="(optional)">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Add Income
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Income Table -->
<div class="card">
    <div class="card-header"><span class="card-title">Income Log</span></div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Source</th>
                        <th>PayPal</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody-income">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
