<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — PGW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/styles.css?v=1771588800">
</head>

<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="text-center mb-4">
                <div class="auth-logo mb-3">
                    <i class="bi bi-shield-lock-fill text-primary" style="font-size:2.5rem;"></i>
                </div>
                <h4 class="mb-1 fw-semibold">Proxy Gateway Manager</h4>
                <p class="text-muted small">Đăng nhập để tiếp tục</p>
            </div>

            <div id="alert-box" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-medium">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input id="username" name="u" type="text" class="form-control border-start-0 ps-0"
                            placeholder="admin" required autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-medium">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input id="password" name="p" type="password" class="form-control border-start-0 ps-0"
                            placeholder="••••••••" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary border-start-0" type="button" id="toggle-pass"
                            tabindex="-1">
                            <i class="bi bi-eye" id="toggle-pass-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-medium" id="btn-login">
                    <span id="btn-login-text">Đăng nhập</span>
                    <span id="btn-login-spinner" class="spinner-border spinner-border-sm ms-2 d-none"
                        role="status"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const btnText = document.getElementById('btn-login-text');
        const btnSpinner = document.getElementById('btn-login-spinner');
        const btnLogin = document.getElementById('btn-login');

        // Toggle password visibility
        document.getElementById('toggle-pass').addEventListener('click', () => {
            const inp = document.getElementById('password');
            const ico = document.getElementById('toggle-pass-icon');
            if (inp.type === 'password') { inp.type = 'text'; ico.className = 'bi bi-eye-slash'; }
            else { inp.type = 'password'; ico.className = 'bi bi-eye'; }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('d-none');
            btnLogin.disabled = true;
            btnSpinner.classList.remove('d-none');
            btnText.textContent = 'Đang xử lý...';

            try {
                const body = {
                    username: form.u.value.trim(),
                    password: form.p.value
                };
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (r.status === 204) {
                    window.location.replace('/');
                    return;
                }
                const msg = await r.text();
                alertBox.textContent = msg || 'Sai tên đăng nhập hoặc mật khẩu';
                alertBox.classList.remove('d-none');
            } catch (err) {
                alertBox.textContent = 'Lỗi kết nối máy chủ';
                alertBox.classList.remove('d-none');
            } finally {
                btnLogin.disabled = false;
                btnSpinner.classList.add('d-none');
                btnText.textContent = 'Đăng nhập';
            }
        });
    </script>
</body>

</html>
